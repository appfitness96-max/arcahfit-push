<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ativar notificações - ARCAHfit</title>

  <style>
    body{
      margin:0;
      background:#0e0d12;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:360px;
      padding:32px;
      border-radius:20px;
      background:#17161f;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    button{
      margin-top:24px;
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:#8a2be2;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    #status{
      margin-top:18px;
      color:#b5b5b5;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Ative as notificações</h2>

  <p>Receba lembretes de treino, refeições e novidades do ARCAHfit.</p>

  <button id="enable">Ativar notificações</button>

  <div id="status"></div>

</div>

<script>

const VAPID_PUBLIC_KEY = "BHSAcu5uZL4Xl0xbFvKYY_YNfhUpi44LYGGq_7cA3iW_VlZvKTUXQeFsmB2Baz9oyUn3f8xb3Hy1y6hqo4dTGJM";

const params = new URLSearchParams(window.location.search);
const userId = params.get("user");

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);

  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }

  return outputArray;
}

document.getElementById("enable").onclick = async () => {

  if (!userId) {
    document.getElementById("status").textContent =
      "Usuário inválido.";
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission !== "granted") {
    document.getElementById("status").textContent =
      "Permissão negada.";
    return;
  }

  const registration =
    await navigator.serviceWorker.register("/push-sw.js");

  const subscription =
    await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey:
        urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });

  const response = await fetch(
    "https://xvdzeofndrbolucqqxhw.supabase.co/functions/v1/subscribe",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        user_id: Number(userId),
        subscription,
      }),
    }
  );

  const result = await response.json();

  if (result.success) {
    document.getElementById("status").textContent =
      "Notificações ativadas com sucesso!";
  } else {
    document.getElementById("status").textContent =
      "Erro ao salvar a inscrição.";
  }
};

</script>

</body>
</html>
