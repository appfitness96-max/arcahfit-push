<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ativar notificações - ARCAHfit</title>

  <style>
    body{
      margin:0;
      background:#0e0d12;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:360px;
      padding:32px;
      border-radius:20px;
      background:#17161f;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    button{
      margin-top:24px;
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:#8a2be2;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    #status{
      margin-top:18px;
      color:#b5b5b5;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Ative as notificações</h2>

  <p>Receba lembretes de treino, refeições e novidades do ARCAHfit.</p>

  <button id="enable">Ativar notificações</button>

  <div id="status"></div>

</div>

<script>

document.getElementById('enable').onclick = async () => {

  if (!('serviceWorker' in navigator)) {
    document.getElementById('status').textContent =
      'Este navegador não suporta notificações.';
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission !== 'granted') {
    document.getElementById('status').textContent =
      'Permissão negada.';
    return;
  }

  const registration =
    await navigator.serviceWorker.register('/push-sw.js');

  document.getElementById('status').textContent =
    'Service Worker registrado com sucesso.';

};

</script>

</body>
</html>
